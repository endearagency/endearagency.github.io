<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>endear — Project Management Service</title>
<meta name="description" content="เอเจนซี่ดูแลโปรเจกต์สายอนิเมะ การ์ตูน และเกม | The project agency for anime, comics & games.">
<meta property="og:title" content="endear — Project Management Service">
<meta property="og:description" content="เอเจนซี่ดูแลโปรเจกต์สายอนิเมะ การ์ตูน และเกม">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Anuphan:wght@400;500;600&display=swap">
<style>
/* Layout: one page. Sticky bar (logo left, mega menu, TH/EN switch). Services are a collapsible list so the page stays short. Single light look by choice (clean white brand). */
:root{
  --bg:#FFFFFF;
  --fg:#151314;
  --muted:#5C585A;
  --faint:#777174;
  --line:#ECE8E9;
  --soft:#F7F4F5;
  --soft2:#EFEBEC;
  --ph:#E9E4E6;
  --accent:#D6336C;
  --on-accent:#FFFFFF;
  --dark:#151314;
  --font-en:'Outfit','Anuphan',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-th:'Anuphan','Outfit',system-ui,'Leelawadee UI','Thonburi',sans-serif;
  --wrap:1240px;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}*{transition:none !important}}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-en);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
html[lang="th"] body{font-family:var(--font-th)}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:var(--wrap);margin:0 auto;padding-inline:20px}
section,[id]{scroll-margin-top:84px}
h1,h2,h3{text-wrap:balance}
.eyebrow{margin:0 0 12px;font-size:13px;font-weight:600;letter-spacing:.12em;color:var(--accent);text-transform:uppercase}
.h2{margin:0 0 12px;font-size:clamp(30px,4vw,48px);line-height:1.12;font-weight:600;letter-spacing:-.02em}
.lead{margin:0;font-size:17px;line-height:1.75;color:var(--muted);max-width:660px}
.note{margin:20px 0 0;font-size:14px;color:var(--faint)}
.row{display:flex;flex-wrap:wrap;gap:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ph{background:var(--ph);border-radius:14px;display:flex;align-items:center;justify-content:center;gap:6px;color:var(--faint);font-size:12px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--bg);border-bottom:1px solid var(--line)}
.nav{max-width:var(--wrap);margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:8px;position:relative}
.logo{text-decoration:none;display:flex;flex-direction:column;align-items:flex-start;line-height:1;margin-right:14px;flex:0 0 auto}
.logo b{font-family:'Outfit',sans-serif;font-size:31px;font-weight:500;letter-spacing:-.02em}
.logo small{font-family:'Outfit',sans-serif;font-size:9px;letter-spacing:.16em;margin-top:3px}
.nav-group{display:flex;align-items:center;gap:4px}
.nav-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.pill{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 16px;border-radius:999px;border:1px solid transparent;background:transparent;font-size:15px;font-weight:500;text-decoration:none;cursor:pointer;white-space:nowrap}
.pill:hover{background:var(--soft)}
.pill[aria-expanded="true"]{background:var(--dark);color:var(--bg)}
.pill.outline{border-color:var(--fg)}
.pill.solid{background:var(--accent);color:var(--on-accent);font-weight:600}
.pill.solid:hover{filter:brightness(.95)}
.icon-btn{width:44px;height:44px;border-radius:999px;border:1px solid var(--soft2);background:var(--bg);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto;font-size:13px;font-weight:600}
.icon-btn:hover{border-color:var(--fg)}
.lang{display:inline-flex;padding:3px;border-radius:999px;border:1px solid var(--soft2)}
.lang button{min-height:36px;min-width:42px;padding:0 10px;border:none;border-radius:999px;background:transparent;font-family:'Outfit',sans-serif;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--dark);color:var(--bg)}
.mob{display:none;margin-left:auto;align-items:center;gap:6px}
.menu-btn{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px 0 16px;border-radius:999px;border:1.5px solid var(--dark);background:var(--dark);color:var(--bg);font-size:15px;font-weight:600;cursor:pointer}
.menu-btn[aria-expanded="true"]{background:var(--bg);color:var(--fg)}
@media (max-width:1000px){.desk{display:none !important}.mob{display:flex}}
@media (max-width:420px){.logo b{font-size:26px}.logo small{font-size:7px;letter-spacing:.08em}.logo{margin-right:0}}

.mega{position:absolute;left:0;right:0;top:100%;background:var(--bg);border-bottom:1px solid var(--line);box-shadow:0 18px 36px rgba(21,19,20,.07);max-height:calc(100vh - 90px);overflow-y:auto}
.mega-grid{max-width:var(--wrap);margin:0 auto;padding:28px 20px 20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:28px}
.mega-col h3{margin:0 0 12px;font-size:16px;font-weight:600}
.mega-col h3 a{text-decoration:none}
.mega-col a.sub{display:block;padding:6px 0;color:var(--muted);text-decoration:none;font-size:15px}
.mega-col a.sub:hover,.mega-col h3 a:hover{color:var(--accent)}
.mega-foot{max-width:var(--wrap);margin:0 auto;padding:0 20px 26px}
.ask{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding:16px 20px;border-radius:16px;background:var(--soft);text-decoration:none}
.ask:hover{background:var(--soft2)}
.ask .go{color:var(--accent);font-weight:600}
.mobile-panel{position:absolute;left:0;right:0;top:100%;background:var(--bg);border-bottom:1px solid var(--line);box-shadow:0 18px 36px rgba(21,19,20,.1);max-height:calc(100vh - 72px);overflow-y:auto;padding:4px 20px 28px}
.mp-label{margin:14px 0 0;font-size:12px;font-weight:600;letter-spacing:.12em;color:var(--faint)}
.mp-cat{padding:12px 0;border-bottom:1px solid var(--line)}
.mp-cat > a{display:flex;align-items:center;min-height:44px;text-decoration:none;font-size:17px;font-weight:600}
.mp-subs{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.mp-subs a{display:inline-flex;align-items:center;min-height:36px;padding:0 12px;border-radius:999px;background:var(--soft);font-size:13px;text-decoration:none}
.mp-link{display:flex;align-items:center;min-height:52px;border-bottom:1px solid var(--line);text-decoration:none;font-size:17px;font-weight:600}
.mp-cta{display:flex;align-items:center;justify-content:center;min-height:52px;margin-top:20px;border-radius:999px;background:var(--accent);color:var(--on-accent);text-decoration:none;font-weight:600}

/* hero */
.hero{padding-block:64px 44px}
.hero h1{margin:0;font-size:clamp(38px,6vw,84px);line-height:1.08;font-weight:600;letter-spacing:-.03em;max-width:1100px}
html[lang="th"] .hero h1{line-height:1.3;letter-spacing:-.01em}
html[lang="th"] .h2,html[lang="th"] .svc-head b,html[lang="th"] .tile b,html[lang="th"] .slide-info h3{line-height:1.38;letter-spacing:0}
html[lang="th"] .h2{padding-top:.08em}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero-row{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-end;justify-content:space-between;margin-top:30px}
.hero-row > div{flex:1 1 420px;max-width:660px;min-width:0}
.hero-sub{margin:0 0 8px;font-size:20px;line-height:1.55;color:#3A3637}
.hero-strip{display:grid;grid-template-columns:minmax(0,2fr) repeat(3,minmax(0,1fr));gap:12px;margin-top:40px}
.hero-strip .ph{height:280px;border-radius:20px}
@media (max-width:760px){.hero-strip{grid-template-columns:repeat(2,minmax(0,1fr))}.hero-strip .ph{height:150px}.hero-strip .ph:first-child{grid-column:1 / -1;height:210px}.hero-strip .ph:last-child{display:none}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 26px;border-radius:999px;text-decoration:none;font-size:16px;font-weight:600;border:1px solid transparent;cursor:pointer}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(.95)}
.btn:disabled{opacity:.6;cursor:wait}
.btn.ghost{border-color:var(--fg);font-weight:500}
.btn.ghost:hover{background:var(--soft)}
.btn.white{background:#FFFFFF;color:var(--fg)}

/* service tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;padding-bottom:64px}
.tile{display:flex;flex-direction:column;gap:14px;padding:12px 12px 18px;border-radius:20px;text-decoration:none;transition:transform .15s ease}
.tile:hover{transform:translateY(-2px)}
.tile .ph{aspect-ratio:4/3;background:rgba(255,255,255,.6);width:100%}
.tile .tx{padding:0 6px;display:flex;flex-direction:column;gap:6px;flex:1 1 auto}
.tile .num{font-size:12px;font-weight:600;letter-spacing:.08em;color:var(--muted)}
.tile b{font-size:19px;font-weight:600;line-height:1.25}
.tile .d{font-size:14px;line-height:1.6;color:#3A3637;flex:1 1 auto}
.tile .more-link{margin-top:6px;font-size:14px;font-weight:600;color:var(--accent)}
.tile:hover .more-link{text-decoration:underline}
.tile.other{border:2px dashed #D3CDCF;background:var(--bg);justify-content:space-between;padding:20px}
.tile.other .plus{font-size:34px;line-height:1;color:var(--accent)}

/* trusted */
.trusted{border-block:1px solid var(--line);background:var(--soft)}
.trusted .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:20px;padding-block:26px}
.trusted p{margin:0;font-size:14px;font-weight:600;color:var(--muted)}
.logos{flex:1 1 560px;display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;min-width:0}
.logos div{height:54px;border:1px dashed #CFC9CB;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--faint);background:var(--bg)}

/* how */
.how{padding-block:88px 72px}
.how-cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:48px;margin-top:40px}
@media (max-width:860px){.how-cols{grid-template-columns:minmax(0,1fr);gap:40px}}
.col-head{margin:0 0 16px;font-size:14px;font-weight:600;letter-spacing:.08em;color:var(--faint);text-transform:uppercase}
.how-list{display:flex;flex-direction:column;gap:12px}
.how-card{display:flex;gap:16px;padding:20px;border:1px solid var(--line);border-radius:18px}
.how-card .ic{flex:0 0 44px;height:44px;border-radius:12px;background:var(--soft);display:flex;align-items:center;justify-content:center;color:var(--accent)}
.how-card h3{margin:0 0 4px;font-size:18px;font-weight:600}
.how-card p{margin:0;font-size:15px;line-height:1.65;color:#4A4547}
.steps{display:flex;flex-direction:column}
.step{display:flex;gap:18px;position:relative;padding-bottom:26px}
.step:last-child{padding-bottom:0}
.step .n{flex:0 0 44px;height:44px;border-radius:999px;background:var(--dark);color:var(--bg);display:flex;align-items:center;justify-content:center;font-family:'Outfit',sans-serif;font-weight:600;font-size:15px;font-variant-numeric:tabular-nums;position:relative;z-index:1}
.step:not(:last-child)::before{content:"";position:absolute;left:21px;top:44px;bottom:0;width:2px;background:var(--line)}
.step h3{margin:8px 0 4px;font-size:18px;font-weight:600}
.step p{margin:0;font-size:15px;line-height:1.65;color:#4A4547}

/* services accordion */
.svc-wrap{padding-bottom:88px}
.svc-list{margin-top:32px;border-bottom:1px solid var(--line)}
.svc{border-top:1px solid var(--line)}
.svc-head{width:100%;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:20px;padding:24px 4px;border:none;background:transparent;text-align:left;cursor:pointer}
.svc-head:hover b{color:var(--accent)}
.svc-head .num{font-family:'Outfit',sans-serif;font-size:14px;font-weight:600;color:var(--accent);font-variant-numeric:tabular-nums;align-self:start;padding-top:8px}
.svc-head b{display:block;font-size:clamp(22px,2.8vw,32px);font-weight:600;line-height:1.2;transition:color .15s}
.svc-head small{display:block;margin-top:4px;font-size:15px;color:var(--muted);line-height:1.6}
.svc-head .chev{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--muted);white-space:nowrap}
.svc-head .chev i{width:44px;height:44px;border-radius:999px;border:1px solid var(--soft2);display:inline-flex;align-items:center;justify-content:center;font-style:normal;color:var(--fg);transition:transform .2s ease, background .2s}
.svc-head[aria-expanded="true"] .chev i{transform:rotate(180deg);background:var(--dark);color:var(--bg);border-color:var(--dark)}
@media (max-width:640px){.svc-head .chev .lbl{display:none}.svc-head{gap:14px}}
.svc-panel{padding:4px 0 44px}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:42px;padding:0 16px;border-radius:999px;border:1px solid #D9D3D5;background:var(--bg);font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap}
.chip:hover{border-color:var(--fg)}
.chip[aria-pressed="true"],.chip[aria-selected="true"]{background:var(--dark);border-color:var(--dark);color:var(--bg)}
.seg{display:inline-flex;gap:4px;padding:4px;border-radius:999px;background:var(--soft2)}
.seg button{min-height:40px;padding:0 16px;border-radius:999px;border:none;background:transparent;font-size:14px;font-weight:500;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--bg);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.panel-top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px}
.panel-top .lead{flex:1 1 380px}

/* talent */
.stage{background:var(--soft);border-radius:28px;padding:22px;display:flex;flex-wrap:wrap;gap:30px;margin-top:20px}
.stage-art{flex:1 1 300px;min-height:420px;border-radius:20px;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
.stage-art .ini{font-family:'Outfit',sans-serif;font-size:160px;font-weight:700;color:rgba(21,19,20,.12);letter-spacing:-.05em}
.stage-art .lbl{position:absolute;left:14px;bottom:14px;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.88);font-size:12px;color:var(--muted)}
.stage-info{flex:1 1 360px;min-width:0;display:flex;flex-direction:column;gap:16px;padding-block:6px}
.type-badge{align-self:flex-start;padding:6px 14px;border-radius:999px;background:var(--dark);color:var(--bg);font-size:13px;font-weight:600}
.stage-info h3{margin:0;font-family:'Outfit','Anuphan',sans-serif;font-size:clamp(32px,4vw,46px);line-height:1;font-weight:600;letter-spacing:-.02em}
.mini{margin:0 0 8px;font-size:12px;font-weight:600;letter-spacing:.1em;color:var(--faint)}
.tag{display:inline-block;padding:6px 12px;border-radius:999px;background:var(--bg);font-size:14px}
.work{display:inline-block;padding:6px 12px;border-radius:999px;border:1px solid var(--fg);font-size:14px;font-weight:500}
.quote{margin:2px 0 0;padding:16px 18px;border-radius:16px;background:var(--bg);font-size:17px;line-height:1.7}
.social{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 16px;border-radius:999px;background:var(--dark);color:var(--bg);text-decoration:none;font-size:14px;font-weight:500}
.roster{flex:1 1 100%;border-top:1px solid var(--line);padding-top:14px;display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.r-btn{flex:0 0 auto;width:86px;padding:6px;border-radius:16px;border:2px solid transparent;background:transparent;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px}
.r-btn:hover{border-color:var(--soft2)}
.r-btn[aria-pressed="true"]{border-color:var(--dark)}
.r-face{width:64px;height:64px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-family:'Outfit',sans-serif;font-size:19px;font-weight:700;color:rgba(21,19,20,.55)}
.r-btn .nm{font-size:12px;font-weight:500;max-width:74px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cards{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:12px;margin-top:20px}
.t-card{flex:0 0 236px;scroll-snap-align:start;text-align:left;border:1px solid var(--line);border-radius:20px;background:var(--bg);padding:0;cursor:pointer;overflow:hidden}
.t-card:hover{border-color:var(--fg)}
.t-card .face{display:flex;align-items:center;justify-content:center;height:280px;font-family:'Outfit',sans-serif;font-size:70px;font-weight:700;color:rgba(21,19,20,.14)}
.t-card .body{display:flex;flex-direction:column;gap:6px;padding:16px 18px 20px}
.t-card .ty{font-size:12px;font-weight:600;letter-spacing:.08em;color:var(--muted)}
.t-card .nm{font-family:'Outfit','Anuphan',sans-serif;font-size:20px;font-weight:600}
.t-card .tg{font-size:13px;color:#4A4547}

/* art */
.art-desc{margin:18px 0;font-size:16px;line-height:1.7;color:#4A4547}
.gallery{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:12px}
.g-tile{flex:0 0 280px;height:280px;scroll-snap-align:start;border-radius:20px;position:relative;overflow:hidden}
.g-img{height:100%;display:flex;align-items:flex-end;padding:16px;font-size:13px;color:#3A3637}
.g-conf{height:100%;background:var(--bg);border:1px solid var(--line);border-radius:20px;display:flex;flex-direction:column;justify-content:space-between;padding:18px;position:relative;overflow:hidden}
.g-conf .blob{position:absolute;right:-44px;top:-44px;width:200px;height:200px;border-radius:999px}
.g-conf > *{position:relative}
.lock{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--dark);color:var(--bg);font-size:12px;font-weight:600}
.g-conf .big{align-self:center;color:var(--accent)}
.g-conf b{display:block;font-size:16px}
.g-conf small{display:block;font-size:13px;color:var(--muted);margin-top:3px}

/* fab / events cards */
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-top:8px}
.s-card{border-radius:20px;border:1px solid var(--line);overflow:hidden;background:var(--bg)}
.s-card .ph{border-radius:0;height:170px}
.card-img{display:block;width:100%;height:170px;object-fit:cover}
.tile-img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:14px}
.s-card .bd{padding:18px 20px 22px}
.s-card h3{margin:0 0 6px;font-size:18px;font-weight:600}
.s-card p{margin:0;font-size:14px;line-height:1.65;color:#4A4547}

/* publishing */
.slide{display:flex;flex-wrap:wrap;gap:24px;border:1px solid var(--line);border-radius:28px;padding:22px;margin-top:18px}
.slide .ph{flex:1 1 340px;min-height:260px;border-radius:20px}
.slide-info{flex:1 1 300px;min-width:0;display:flex;flex-direction:column;justify-content:space-between;gap:22px;padding-block:6px}
.slide-info .ct{margin:0 0 8px;font-family:'Outfit',sans-serif;font-size:14px;font-weight:600;color:var(--faint);font-variant-numeric:tabular-nums}
.slide-info h3{margin:0 0 10px;font-size:30px;font-weight:600}
.slide-info p{margin:0;font-size:17px;line-height:1.7;color:#4A4547}

/* about */
.about{padding-bottom:88px}
.about-grid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:48px;align-items:start}
@media (max-width:860px){.about-grid{grid-template-columns:minmax(0,1fr);gap:28px}}
.about-photo{display:flex;flex-direction:column;gap:14px}
.about-img{display:block;width:100%;height:auto;aspect-ratio:4/5;object-fit:cover;object-position:center 22%;border-radius:24px;background:var(--ph)}
.about-photo .who b{display:block;font-size:20px;font-weight:600}
.about-photo .who span{display:block;font-size:14px;color:var(--muted)}
.about-text p{margin:0 0 16px;font-size:17px;line-height:1.8;color:#3A3637;max-width:640px}
.about-text p.eyebrow{margin:0 0 12px;font-size:13px;line-height:1.55;color:var(--accent)}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:28px;max-width:640px}
.fact{padding:18px;border-radius:18px;background:var(--soft)}
.fact b{display:block;font-family:'Outfit','Anuphan',sans-serif;font-size:26px;font-weight:600;color:var(--accent);line-height:1.1;margin-bottom:6px}
.fact span{font-size:14px;line-height:1.5;color:#4A4547}

/* creators */
.creators{background:var(--accent);color:var(--on-accent);padding-block:80px}
.creators .eyebrow{color:var(--on-accent)}
.cr-row{display:flex;flex-wrap:wrap;gap:40px;justify-content:space-between}
.cr-row > div:first-child{flex:1 1 360px;max-width:520px}
.cr-grid{flex:1 1 420px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;min-width:0}
@media (max-width:520px){.cr-grid{grid-template-columns:minmax(0,1fr)}}
.cr-card{border:1px solid rgba(255,255,255,.5);border-radius:20px;padding:22px}
.cr-card h3{margin:0 0 6px;font-size:18px;font-weight:600}
.cr-card p{margin:0;font-size:15px;line-height:1.65}

/* contact */
.contact{padding-block:88px}
.ct-row{display:flex;flex-wrap:wrap;gap:30px;margin-top:36px}
.channels{flex:1 1 340px;display:flex;flex-direction:column;gap:10px;min-width:0}
.channel{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:58px;padding:8px 10px 8px 20px;border:1px solid var(--line);border-radius:16px}
.channel b{font-family:'Outfit',sans-serif;font-weight:600}
.channel .v{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:14px;min-width:0}
.channel .v span,.channel .v a{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;user-select:all}
.channel .v a{color:var(--fg);text-decoration:underline;text-decoration-color:var(--soft2);text-underline-offset:3px}
.channel .v a:hover{color:var(--accent);text-decoration-color:var(--accent)}
.cv{border:none;background:none;padding:0;font:inherit;font-size:14px;color:var(--fg);cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-decoration:underline dotted;text-decoration-color:#C9C2C5;text-underline-offset:3px}
.cv:hover{color:var(--accent)}
.copy{min-height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--soft2);background:var(--bg);font-size:13px;cursor:pointer}
.copy:hover{border-color:var(--fg)}
.qr{width:84px;height:84px;border:1px dashed #CFC9CB;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--faint)}
form.f{flex:1 1 420px;display:flex;flex-direction:column;gap:16px;padding:26px;border-radius:24px;background:var(--soft);min-width:0}
.f-two{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px}
.field{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:500}
.field input,.field select,.field textarea{font:inherit;font-size:15px;font-weight:400;padding:12px 14px;border:1px solid #D9D3D5;border-radius:12px;background:var(--bg);color:var(--fg);width:100%}
.field textarea{resize:vertical}
.f-msg{margin:0;padding:12px 14px;border-radius:12px;background:var(--bg);font-size:14px;line-height:1.6}

footer{border-top:1px solid var(--line)}
footer .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;padding-block:28px 96px;font-size:14px;color:var(--faint)}

.float{position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:60;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;min-width:52px;padding:0 22px;border-radius:999px;background:var(--dark);color:var(--bg);text-decoration:none;font-size:15px;font-weight:600;box-shadow:0 10px 26px rgba(21,19,20,.22)}
@media (max-width:640px){.float{padding:0}.float .t{display:none}.stage-art{min-height:290px}.stage-art .ini{font-size:110px}}

/* overlays */
.overlay{position:fixed;inset:0;z-index:90;background:rgba(21,19,20,.5);display:flex;justify-content:center;align-items:flex-start;padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px))}
.overlay.center{align-items:center}
.sheet{width:100%;max-width:680px;margin-top:4vh;max-height:86vh;overflow-y:auto;background:var(--bg);border-radius:24px;padding:16px}
.s-bar{display:flex;align-items:center;gap:10px;padding:2px 2px 14px;border-bottom:1px solid var(--line)}
.s-bar input{flex:1 1 auto;min-width:0;border:none;outline:none;font:inherit;font-size:18px;min-height:44px;background:transparent;color:var(--fg)}
.s-title{margin:14px 4px 6px;font-size:12px;font-weight:600;letter-spacing:.12em;color:var(--faint)}
.result{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px;padding:10px 14px;border-radius:12px;text-decoration:none}
.result:hover,.result:focus-visible{background:var(--soft)}
.result b{display:block;font-size:16px;font-weight:600}
.result small{display:block;font-size:13px;color:var(--faint)}
.result .arr{color:var(--accent);font-size:18px}
.modal{background:var(--bg);border-radius:28px;width:100%;max-width:820px;max-height:90vh;overflow:auto;display:flex;flex-wrap:wrap}
.modal .face{flex:1 1 280px;min-height:320px;display:flex;align-items:center;justify-content:center;font-family:'Outfit',sans-serif;font-size:120px;font-weight:700;color:rgba(21,19,20,.12)}

.modal h3{margin:0;font-family:'Outfit','Anuphan',sans-serif;font-size:32px;font-weight:600}
.modal .tag{background:var(--soft)}
.modal .quote{background:var(--soft)}
</style>

function setMega(open){ $('mega').hidden = !open; $('servicesBtn').setAttribute('aria-expanded', open); }
function setMobile(open){
  $('mobilePanel').hidden = !open; $('menuBtn').setAttribute('aria-expanded', open);
  $('menuLbl').textContent = open ? t('nav.close') : t('nav.menu');
  $('menuIc').innerHTML = icon(open ? 'x' : 'burger', 18);
}
function closeMenus(){ setMega(false); setMobile(false); }
var lastFocus = null;
function showOverlay(id){ lastFocus = document.activeElement; $(id).hidden = false; document.body.style.overflow = 'hidden'; }
function hideOverlays(){
  var any = !$('search').hidden || !$('modalWrap').hidden;
  $('search').hidden = true; $('modalWrap').hidden = true; document.body.style.overflow = '';
  if(any && lastFocus && lastFocus.focus) try{ lastFocus.focus({preventScroll:true}); }catch(e){}
}
function applySet(o){
  if(!o) return;
  if(o.filter) st.filter = o.filter;
  if(o.sel) st.sel = o.sel;
  if(o.mode) st.mode = o.mode;
  if(typeof o.art==='number') st.art = o.art;
  if(typeof o.pub==='number') st.pub = o.pub;
  if(o.svc) $('fSvc').value = o.svc;
  renderAll();
}
function setLang(l){
  st.lang = l; try{ localStorage.setItem('endear-lang', l); }catch(e){}
  renderStatic(); renderAll(); renderSearch();
}

TALENTS.forEach(function(x){ addIdx([x.name,x.name], ['ทาเลนต์ · '+TYPES[x.type][0], 'Talent · '+x.type], '#talent', x.tags.join(' '), {filter:'All', sel:x.id, mode:'select'}); });
var POPULAR = ['LINE Sticker','Live2D & Rigging','VTuber','Voice Dubbing','Printing','UV Printing'];
function renderSearch(){
  var q = $('q').value.trim().toLowerCase();
  var hits = q ? IDX.filter(function(r){ return (r.label.join(' ')+' '+r.cat.join(' ')+' '+r.kw).toLowerCase().indexOf(q)!==-1; })
               : IDX.filter(function(r){ return POPULAR.indexOf(r.label[1])!==-1; });
  hits = hits.slice(0,8);
  $('sTitle').textContent = q ? (hits.length ? t('s.results') : t('s.none')) : t('s.popular');
  $('sResults').innerHTML = hits.map(function(r){
    return '<a class="result" href="'+r.href+'" data-close data-set="'+setAttr(r.set)+'"><span><b>'+esc(L(r.label))+'</b><small>'+esc(L(r.cat))+'</small></span><span class="arr" aria-hidden="true">→</span></a>';
  }).join('');
  $('sEmpty').hidden = !(q && !hits.length);
}

/* ---------- events ---------- */
document.addEventListener('click', function(e){
  var el = e.target.closest('button, a, .overlay');
  if(!el){ if(!$('mega').hidden && !e.target.closest('#mega')) setMega(false); return; }
  if(el.id==='servicesBtn'){ setMobile(false); setMega($('mega').hidden); return; }
  if(el.id==='menuBtn'){ setMega(false); setMobile($('mobilePanel').hidden); return; }
  if(el.dataset.lang){ setLang(el.dataset.lang); return; }
  if(el.hasAttribute('data-lang-flip')){ setLang(st.lang==='th'?'en':'th'); return; }
  if(el.hasAttribute('data-open-search')){ closeMenus(); $('q').value=''; renderSearch(); showOverlay('search'); setTimeout(function(){ $('q').focus(); }, 30); return; }
  if(el.hasAttribute('data-close-search') || el.hasAttribute('data-close-modal')){ hideOverlays(); return; }
  if(el.classList.contains('overlay')){ if(e.target===el) hideOverlays(); return; }
  if(el.dataset.toggle){ setSvc(el.dataset.toggle, el.getAttribute('aria-expanded')!=='true'); return; }
  if(el.dataset.filter){ st.filter = el.dataset.filter; renderTalent(); return; }
  if(el.dataset.mode){ st.mode = el.dataset.mode; renderTalent(); return; }
  if(el.dataset.pick){ st.sel = el.dataset.pick; renderTalent(); return; }
  if(el.dataset.open){ openModal(el.dataset.open); return; }
  if(el.dataset.art!==undefined){ st.art = +el.dataset.art; renderArt(); return; }
  if(el.dataset.pub!==undefined){ st.pub = +el.dataset.pub; renderPub(); return; }
  if(el.id==='pubPrev'){ st.pub = (st.pub+PUB.length-1)%PUB.length; renderPub(); return; }
  if(el.id==='pubNext'){ st.pub = (st.pub+1)%PUB.length; renderPub(); return; }
  if(el.dataset.copy!==undefined){
    var btn = el.classList.contains('cv') ? el.parentNode.querySelector('.copy') : el, done = function(){ btn.textContent = t('copied'); setTimeout(function(){ btn.textContent = t('copy'); }, 1400); };
    try{ navigator.clipboard.writeText(el.dataset.copy).then(done, function(){ selectText(btn); }); }catch(err){ selectText(btn); }
    return;
  }
  if(el.dataset.set){ try{ applySet(JSON.parse(el.dataset.set)); }catch(err){} }
  var href = el.tagName==='A' ? el.getAttribute('href') : '';
  if(href && href.charAt(0)==='#' && SVC_IDS.indexOf(href.slice(1))!==-1){ setSvc(href.slice(1), true); }
  if(el.hasAttribute('data-close') || el.closest('#mega') || el.closest('#mobilePanel')){ closeMenus(); hideOverlays(); }
  else if(href && href.charAt(0)==='#'){ closeMenus(); }
});
function selectText(btn){ var s = btn.parentNode.querySelector('.cv, span, a'); if(!s) return; var r = document.createRange(); r.selectNodeContents(s); var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r); }
document.addEventListener('keydown', function(e){ if(e.key==='Escape'){ closeMenus(); hideOverlays(); } });
$('q').addEventListener('input', renderSearch);
$('q').addEventListener('keydown', function(e){ if(e.key==='Enter'){ var f = $('sResults').querySelector('a'); if(f){ e.preventDefault(); f.click(); location.hash = f.getAttribute('href'); } } });
$('form').addEventListener('submit', function(e){
  e.preventDefault();
  var n = $('fNote'), btn = $('form').querySelector('button[type="submit"]');
  var name = $('fName').value.trim(), email = $('fEmail').value.trim(), msg = $('fMsg').value.trim();
  n.hidden = false;
  if(!name || !email || !msg || email.indexOf('@') < 1){ n.textContent = t('f.need'); return; }
  if($('fHoney').value){ return; }
  btn.disabled = true; n.textContent = t('f.sending');
  var svc = $('fSvc').options[$('fSvc').selectedIndex].text;
  fetch('https://formsubmit.co/ajax/endear.atm@gmail.com', {
    method:'POST', headers:{'Content-Type':'application/json','Accept':'application/json'},
    body: JSON.stringify({ name:name, email:email, service:svc, message:msg, _subject:'[endear] ข้อความใหม่จากเว็บ: '+svc, _replyto:email, _template:'table' })
  }).then(function(r){ return r.json().catch(function(){ return {}; }).then(function(d){ if(!r.ok || d.success===false || d.success==='false') throw new Error('send'); }); })
    .then(function(){ n.textContent = t('f.ok'); $('form').reset(); })
    .catch(function(){ n.textContent = t('f.err'); })
    .then(function(){ btn.disabled = false; });
});

document.querySelectorAll('[data-icon]').forEach(function(el){ el.innerHTML = icon(el.dataset.icon, +el.dataset.size||20); el.style.display='inline-flex'; });
renderStatic(); renderAll(); renderSearch();
var h = (location.hash||'').slice(1); if(SVC_IDS.indexOf(h)!==-1) setSvc(h, true);
})();
</script>
